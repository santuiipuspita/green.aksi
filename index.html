<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GreenAksi — Platform Aksi Lingkungan Generasi Muda</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10281f;--moss:#2d6a4f;--leaf:#52b788;--mist:#eef4f0;--sun:#f2b134;--river:#1d6f8a;--red:#c8483a;--line:#d5e2da;--bg:#fbfdfb}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
a{color:inherit}
header{position:sticky;top:0;z-index:1000;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:.7rem 1.2rem;flex-wrap:wrap;gap:.5rem}
.logo{font-weight:800;font-size:1.2rem;text-decoration:none}.logo span{color:var(--leaf)}
nav{display:flex;gap:.2rem;flex-wrap:wrap;position:relative}
nav a{text-decoration:none;font-size:.9rem;padding:.35rem .7rem;border-radius:99px;color:#cfe3d8}
nav a{position:relative;z-index:1;transition:color .2s,background .2s}nav a:hover{background:#ffffff14}nav a.on{color:#fff}
#pill{position:absolute;left:0;top:0;background:var(--moss);border-radius:99px;transition:transform .5s cubic-bezier(.3,1.4,.5,1),width .4s,height .4s}
main{max-width:1080px;margin:auto;padding:1.5rem 1.2rem 3rem}
h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.1;font-weight:800}
h2{font-size:1.6rem;margin-bottom:.3rem}
.sub{color:#4a6558;margin-bottom:1.2rem;max-width:62ch}
.hero{background:var(--ink);color:#fff;border-radius:20px;padding:3rem 2rem;margin-bottom:2rem;position:relative;overflow:hidden}
.hero p{max-width:55ch;color:#cfe3d8;margin:1rem 0 1.5rem}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:var(--moss);opacity:.5}
.btn{display:inline-block;background:var(--sun);color:var(--ink);border:0;font:inherit;font-weight:700;padding:.65rem 1.2rem;border-radius:10px;cursor:pointer;text-decoration:none}
.btn.alt{background:var(--moss);color:#fff}.btn.sm{padding:.35rem .8rem;font-size:.85rem}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--river);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1.1rem}
.tool{text-decoration:none;display:block;transition:border-color .15s}.tool:hover{border-color:var(--moss)}
.tool b{display:block;font-size:1.05rem;margin:.3rem 0}.tool p{font-size:.9rem;color:#4a6558}
.ico{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:1.3rem;background:var(--mist)}
.stats{display:flex;gap:2rem;flex-wrap:wrap;margin:2rem 0}
.stats div{font-size:.9rem;color:#4a6558}.stats strong{display:block;font-size:1.8rem;color:var(--moss)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}
.chip{border:1px solid var(--line);background:#fff;padding:.3rem .8rem;border-radius:99px;cursor:pointer;font:inherit;font-size:.85rem}
.chip.on{background:var(--moss);color:#fff;border-color:var(--moss)}
#map{height:420px;border-radius:14px;border:1px solid var(--line);margin-bottom:1rem}
form{display:grid;gap:.6rem}
label{font-size:.85rem;font-weight:700}
input,select,textarea{font:inherit;padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.bar{height:10px;background:var(--mist);border-radius:9px;overflow:hidden;margin:.5rem 0 .3rem}
.bar i{display:block;height:100%;background:var(--leaf)}
.tag{display:inline-block;font-size:.75rem;padding:.1rem .6rem;border-radius:99px;background:var(--mist);color:var(--moss);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{text-align:left;padding:.5rem;border-bottom:1px solid var(--line)}
.stack{display:grid;gap:.8rem}
.ok{background:#e3f4ea;border-radius:8px;padding:.6rem .8rem;font-size:.9rem;margin-top:.6rem}
.check{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem 0;border-bottom:1px solid var(--line)}.check input{width:auto;margin-top:.35rem}
.photo{aspect-ratio:4/3;border-radius:10px;display:grid;place-items:center;font-size:2rem;color:#fff}
.lvl{font-size:2.4rem;font-weight:800;color:var(--moss)}
.badge{opacity:.35}.badge.got{opacity:1}
footer{text-align:center;padding:2rem 1rem;color:#4a6558;font-size:.85rem;border-top:1px solid var(--line)}
/* ===== GERAK / ANIMASI ===== */
#sp{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--sun);transform:scaleX(0);transform-origin:left;z-index:2000}
.hero{background:linear-gradient(120deg,#10281f,#1d4a38,#10281f);background-size:220% 220%;animation:bg 14s ease infinite}
.hero:after{z-index:0;animation:float 9s ease-in-out infinite}
.hero:before{content:"";position:absolute;left:-80px;bottom:-90px;width:240px;height:240px;border-radius:50%;background:var(--river);opacity:.35;animation:float 11s ease-in-out infinite reverse}
.hero>*{position:relative;z-index:1}.hero>.lf{position:absolute;font-style:normal;font-size:2rem;animation:drift 7s ease-in-out infinite}
.w{display:inline-block;animation:rise .8s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i)*90ms + 250ms)}
.btn{transition:transform .15s,box-shadow .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px #0003}.btn:active{transform:scale(.95)}
.card{transition:transform .25s,box-shadow .25s,border-color .15s}
.grid>.card:hover{transform:translateY(-5px);box-shadow:0 14px 28px #10281f1f}
.tool .ico{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}.tool:hover .ico{transform:rotate(-10deg) scale(1.18)}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1) var(--d),transform .7s cubic-bezier(.2,.7,.2,1) var(--d)}
.rv.in{opacity:1;transform:none}.rv.done{transition:transform .25s,box-shadow .25s,border-color .15s}
.bar i{transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
.ok{animation:rise .45s cubic-bezier(.2,.7,.2,1)}
.check span{transition:color .3s}.check input:checked+span{color:var(--moss)}
path.leaflet-interactive{animation:pop .55s cubic-bezier(.3,1.6,.5,1) backwards;transform-box:fill-box;transform-origin:center}
@keyframes rise{from{opacity:0;transform:translateY(.7em)}}
@keyframes pop{from{transform:scale(0);opacity:0}}
@keyframes bg{50%{background-position:100% 100%}}
@keyframes float{50%{transform:translate(-24px,26px) scale(1.1)}}
@keyframes drift{0%,100%{transform:translateY(0) rotate(-12deg)}50%{transform:translateY(-22px) rotate(14deg)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.rv{opacity:1!important;transform:none!important}}
</style>
</head>
<body>
<header>
  <a class="logo" href="#beranda">Green<span>Aksi</span></a>
  <nav id="nav"></nav>
</header>
<div id="sp"></div>
<main id="app"></main>
<footer>GreenAksi — inovasi digital untuk lingkungan Indonesia. Data pada prototipe ini bersifat contoh.</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
/* ============ DATA CONTOH (ganti dengan data asli kamu) ============ */
/* ===== FIREBASE: isi 4 nilai ini dari Firebase Console (Project settings > Your apps > Web) ===== */
const FBCFG={apiKey:'ISI_API_KEY',authDomain:'ISI.firebaseapp.com',projectId:'ISI_PROJECT_ID',appId:'ISI_APP_ID'};
const ADMINS=['emailkamu@gmail.com'];
const CLOUD=!FBCFG.apiKey.startsWith('ISI');
let CLOUDAPI=null;const C={reports:[],orgs:[],orgevents:[],user:null};
const me=()=>(S.get('user',null)||{}).email||'anon';
const add=(c,o)=>{if(CLOUD)return CLOUDAPI.add(c,o);const a=S.get(c,[]);a.push({...o,id:Date.now()});S.set(c,a)};
const upd=(c,id,o)=>{if(CLOUD)return CLOUDAPI.upd(c,id,o);const a=S.get(c,[]),x=a.find(z=>String(z.id)===String(id));if(x){Object.assign(x,o);S.set(c,a)}};
const logout=()=>CLOUD?CLOUDAPI.logout():(S.set('user',null),go());
const refresh=()=>{const t=document.activeElement&&document.activeElement.tagName;if(!/INPUT|TEXTAREA|SELECT/.test(t))go(true)};
const PAGES=[
 ['beranda','Beranda'],['greenmap','GreenMap'],['youth','Youth Action'],
 ['greenfund','GreenFund'],['ecolearn','EcoLearn'],['myimpact','My Impact'],['organisasi','Organisasi'],['akun','Akun']];
const TOOLS=[
 ['greenmap','🗺️','GreenMap','Peta interaktif kondisi lingkungan: banjir, longsor, karhutla, pencemaran, bank sampah, dan komunitas.'],
 ['youth','🙌','Youth Action','Temukan dan daftar kegiatan sukarelawan lingkungan di sekitarmu.'],
 ['greenfund','🌱','GreenFund','Dukung program lingkungan dengan target dan laporan dana yang transparan.'],
 ['ecolearn','📚','EcoLearn','Artikel, panduan sampah, mitigasi bencana, dan tantangan mingguan.'],
 ['myimpact','🏅','My Impact','Lihat total kontribusimu: laporan, relawan, donasi, dan tantangan.']];
const MARKERS=[
 {t:'banjir',n:'Banjir Kampung Melayu',lat:-6.225,lng:106.866,d:'Genangan 60 cm setelah hujan deras.'},
 {t:'longsor',n:'Longsor Puncak Bogor',lat:-6.66,lng:106.95,d:'Jalur tertutup material longsor.'},
 {t:'karhutla',n:'Titik Panas Riau',lat:0.51,lng:101.45,d:'Terdeteksi titik api di lahan gambut.'},
 {t:'pencemaran',n:'Pencemaran Citarum',lat:-6.98,lng:107.6,d:'Limbah cair di aliran sungai.'},
 {t:'banksampah',n:'Bank Sampah Bersinar',lat:-7.795,lng:110.37,d:'Buka Sen–Sab, 08.00–15.00.'},
 {t:'komunitas',n:'Komunitas Sungai Bersih',lat:-7.25,lng:112.75,d:'Aksi bersih sungai tiap Minggu.'}];
const TYPE={banjir:['Banjir','#1d6f8a'],longsor:['Longsor','#8a5a2b'],karhutla:['Karhutla','#c8483a'],pencemaran:['Pencemaran','#7a4aa0'],banksampah:['Bank Sampah','#2d6a4f'],komunitas:['Komunitas','#f2b134']};
const EVENTS=[
 {id:1,n:'Bersih Sungai Ciliwung',tgl:'Sab, 22 Nov 2026 · 07.00',lok:'Jakarta Timur',k:'Bersih-bersih',q:40},
 {id:2,n:'Tanam 500 Mangrove',tgl:'Min, 30 Nov 2026 · 08.00',lok:'Muara Angke, Jakarta',k:'Penanaman pohon',q:100},
 {id:3,n:'Edukasi Pilah Sampah di Sekolah',tgl:'Sab, 6 Des 2026 · 09.00',lok:'Surakarta',k:'Edukasi',q:25},
 {id:4,n:'Kampanye Hari Bebas Plastik',tgl:'Min, 14 Des 2026 · 06.30',lok:'Bandung',k:'Kampanye',q:60}];
const ORGS=[{id:1,n:'Komunitas Sungai Bersih',kota:'Surakarta',v:1},{id:2,n:'Bank Sampah Bersinar',kota:'Yogyakarta',v:1}];
const DOCS=[['Bersih Pantai','#1d6f8a'],['Tanam Pohon','#2d6a4f'],['Workshop Kompos','#8a5a2b']];
const FUNDS=[
 {id:1,n:'Bibit Mangrove Pesisir Demak',t:25000000,c:17400000,keb:'Bibit, tenaga tanam, perawatan 6 bulan.'},
 {id:2,n:'Fasilitas Pengolahan Sampah Desa',t:40000000,c:12800000,keb:'Mesin pencacah, gerobak, kontainer pilah.'},
 {id:3,n:'Pemulihan Taman Kota',t:15000000,c:14100000,keb:'Pohon peneduh, bangku, tempat sampah terpilah.'}];
const LAPORAN=[['Pembelian 2.000 bibit mangrove',8500000],['Upah penanam lokal',4200000],['Alat pencacah sampah',6500000],['Dokumentasi & pelaporan',900000]];
const ARTIKEL=[
 ['Mengapa Sampah Plastik Berbahaya bagi Laut','Plastik terurai ratusan tahun dan berubah menjadi mikroplastik yang masuk rantai makanan.'],
 ['Infografis: Perjalanan Sampah dari Rumah','Dari tempat sampah, TPS, hingga TPA — dan titik di mana kamu bisa mengurangi.'],
 ['Hutan Hujan dan Iklim Indonesia','Hutan menyimpan karbon dan mengatur tata air; kebakaran melepaskannya kembali.']];
const PILAH=[['Organik','Sisa makanan, daun. Jadikan kompos.','#52b788'],['Anorganik','Plastik, kaleng, kertas bersih. Setor ke bank sampah.','#1d6f8a'],['B3','Baterai, lampu, obat kedaluwarsa. Serahkan ke titik khusus.','#c8483a']];
const MITIGASI=[['Banjir','Pindahkan barang ke tempat tinggi, matikan listrik, siapkan tas siaga, ikuti info BMKG/BPBD.'],['Longsor','Waspada retakan tanah dan air keruh di lereng; jauhi area lereng saat hujan lebat.'],['Karhutla','Jangan membakar lahan, laporkan titik api, gunakan masker saat kabut asap.']];
const CHALLENGE=[['Bawa tumbler & tas belanja sendiri selama seminggu',10],['Pilah sampah rumah jadi organik dan anorganik',15],['Matikan lampu & alat elektronik yang tidak dipakai',10],['Ajak 1 teman ikut kegiatan relawan',20]];
const WEEK=new Date().toISOString().slice(0,10).slice(0,8)+'W'+Math.ceil(new Date().getDate()/7);

/* ============ STATE (localStorage) ============ */
const S={
 get(k,d){if(CLOUD&&k==='user')return C.user;if(CLOUD&&k in C)return C[k];try{return JSON.parse(localStorage.getItem('ga_'+k))??d}catch(e){return d}},
 set(k,v){try{localStorage.setItem('ga_'+k,JSON.stringify(v))}catch(e){}}};
const rp=n=>'Rp'+n.toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const h=s=>{let x=0;for(const c of s)x=(x*31+c.charCodeAt(0))|0;return x};
const ADMIN={nama:'Admin GreenAksi',email:'admin@greenaksi.id',pw:h('admin123'),role:'admin'};
const allEvents=()=>[...EVENTS,...S.get('orgevents',[])];
const allOrgs=()=>[...ORGS,...S.get('orgs',[])];
const $=s=>document.querySelector(s);
const impact=()=>{const r=S.get('reports',[]).filter(x=>x.owner===me()).length,v=S.get('regs',[]).length,d=S.get('dons',[]).reduce((a,b)=>a+b.amt,0),c=(S.get('chal',{})[WEEK]||[]).length;
 const pts=r*20+v*30+Math.floor(d/10000)+c*10;return{r,v,d,c,pts}};

/* ============ ROUTER ============ */
let map=null;
const RM=matchMedia('(prefers-reduced-motion:reduce)').matches;
const io=new IntersectionObserver(es=>es.forEach(x=>{if(x.isIntersecting){x.target.classList.add('in');setTimeout(()=>x.target.classList.add('done'),1000);io.unobserve(x.target)}}),{threshold:.12});
const cnt=el=>{const t=el.textContent,n=parseInt(t.replace(/\D/g,''))||0;if(!n)return;const p=t.match(/^\D*/)[0],s=t.match(/\D*$/)[0],t0=performance.now();
 const st=now=>{const k=Math.min(1,(now-t0)/1100),e=1-Math.pow(1-k,3);el.textContent=p+Math.round(n*e).toLocaleString('id-ID')+s;if(k<1)requestAnimationFrame(st)};requestAnimationFrame(st)};
function fx(keep){if(RM)return;
 document.querySelectorAll('#app .bar i').forEach(b=>{const w=b.style.width;b.style.width='0';setTimeout(()=>b.style.width=w,60)});
 if(keep)return;
 $('#app').animate([{opacity:0,transform:'translateY(14px)'},{opacity:1,transform:'none'}],{duration:420,easing:'cubic-bezier(.2,.7,.2,1)'});
 document.querySelectorAll('#app .card,#app .stats div,#app .photo,#app h2,#app .sub').forEach((el,i)=>{el.classList.add('rv');el.style.setProperty('--d',Math.min(i,8)*70+'ms');io.observe(el)});
 document.querySelectorAll('#app .stats strong,#app .lvl').forEach(cnt)}
const posPill=()=>{const a=document.querySelector('#nav .on'),p=$('#pill');if(!a||!p)return;p.style.transform=`translate(${a.offsetLeft}px,${a.offsetTop}px)`;p.style.width=a.offsetWidth+'px';p.style.height=a.offsetHeight+'px'};
window.addEventListener('resize',posPill);if(document.fonts)document.fonts.ready.then(posPill);
window.addEventListener('scroll',()=>{const h=document.documentElement;$('#sp').style.transform=`scaleX(${h.scrollTop/((h.scrollHeight-h.clientHeight)||1)})`},{passive:true});
function go(keep){
 const p=(location.hash||'#beranda').slice(1);
 const page=PAGES.find(x=>x[0]===p)?p:'beranda';
 const nv=$('#nav');if(!nv.children.length)nv.innerHTML='<i id="pill"></i>'+PAGES.map(x=>`<a href="#${x[0]}">${x[1]}</a>`).join('');
 nv.querySelectorAll('a').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+page));posPill();
 if(map){map.remove();map=null}
 $('#app').innerHTML=VIEWS[page]();
 if(!keep)window.scrollTo(0,0);
 if(INIT[page])INIT[page]();
 fx(keep);
}
window.addEventListener('hashchange',()=>{if(RM||!$('#app').animate)return go();const a=$('#app').animate([{opacity:1,transform:'none'},{opacity:0,transform:'translateY(-10px)'}],{duration:160,fill:'forwards'});a.onfinish=()=>{a.cancel();go()}});

/* ============ VIEWS ============ */
const VIEWS={
beranda(){const i=impact();return`
 <section class="hero"><i class="lf" style="left:62%;top:14%">🍃</i><i class="lf" style="left:80%;top:52%;animation-delay:-2.5s">🌿</i><i class="lf" style="left:90%;top:12%;animation-delay:-5s">🍃</i><h1>${'Satu aksi kecil, dampak untuk Indonesia.'.split(' ').map((w,i)=>`<span class="w" style="--i:${i}">${w}</span>`).join(' ')}</h1>
 <p>GreenAksi mempertemukan peta kondisi lingkungan, kegiatan relawan, donasi transparan, dan edukasi dalam satu platform untuk generasi muda.</p>
 <a class="btn" href="#greenmap">Buka GreenMap</a> <a class="btn alt" href="#youth">Cari kegiatan</a></section>
 <h2>Pilih alat yang kamu butuhkan</h2><p class="sub">Lima fitur yang saling terhubung: lihat masalah, bergerak, mendanai, belajar, lalu pantau dampakmu.</p>
 <div class="grid">${TOOLS.map(t=>`<a class="card tool" href="#${t[0]}"><div class="ico">${t[1]}</div><b>${t[2]}</b><p>${t[3]}</p></a>`).join('')}</div>
 <div class="stats"><div><strong>${MARKERS.length+S.get('reports',[]).length}</strong>titik di peta</div><div><strong>${EVENTS.length}</strong>kegiatan terbuka</div><div><strong>${i.pts}</strong>poin dampakmu</div></div>`},

greenmap(){return`<h2>GreenMap</h2><p class="sub">Lihat kondisi lingkungan di berbagai wilayah. Klik peta untuk memilih lokasi laporan.</p>
 <div class="chips" id="chips"></div><div id="map"></div>
 <div class="card"><h2 style="font-size:1.2rem">Laporkan masalah lingkungan</h2>
 <form id="rf"><div class="two"><div><label for="rt">Jenis</label><select id="rt">${Object.keys(TYPE).filter(k=>!['banksampah','komunitas'].includes(k)).map(k=>`<option value="${k}">${TYPE[k][0]}</option>`).join('')}</select></div>
 <div><label for="rn">Nama lokasi</label><input id="rn" required placeholder="mis. Sungai di dekat pasar"></div></div>
 <label for="rd">Deskripsi</label><textarea id="rd" rows="3" required></textarea>
 <p id="coord" class="sub" style="margin:0">Lokasi: klik peta untuk memilih titik.</p>
 <button class="btn alt" type="submit">Kirim laporan</button></form><div id="rmsg"></div></div>`},

youth(){const regs=S.get('regs',[]);return`<h2>Youth Action</h2><p class="sub">Daftar kegiatan sukarelawan, cek jadwal dan lokasi, lalu bergabung.</p>
 <div class="grid">${allEvents().map(e=>`<div class="card"><span class="tag">${e.k}</span>${e.by?` <span class="tag">✓ ${esc(e.by)}</span>`:''}<b style="display:block;margin:.4rem 0">${esc(e.n)}</b>
 <p style="font-size:.9rem">📅 ${e.tgl}<br>📍 ${esc(e.lok)}<br>👥 Kuota ${e.q} orang</p>
 ${regs.map(String).includes(String(e.id))?'<p class="ok">Kamu sudah terdaftar ✓</p>':`<button class="btn alt sm" style="margin-top:.6rem" data-reg="${e.id}">Daftar relawan</button>`}</div>`).join('')}</div>
 <div id="regform"></div>
 <h2 style="margin-top:2rem">Dokumentasi kegiatan</h2><p class="sub">Ganti kotak warna ini dengan foto asli kegiatan.</p>
 <div class="grid">${DOCS.map(d=>`<div><div class="photo" style="background:${d[1]}">📷</div><p style="font-size:.9rem;margin-top:.3rem">${d[0]}</p></div>`).join('')}</div>`},

greenfund(){const dons=S.get('dons',[]);return`<h2>GreenFund</h2><p class="sub">Pilih program, lihat progres, dan baca laporan penggunaan dananya. Donasi di prototipe ini hanya simulasi.</p>
 <div class="grid">${FUNDS.map(f=>{const c=f.c+dons.filter(d=>d.id===f.id).reduce((a,b)=>a+b.amt,0),p=Math.min(100,Math.round(c/f.t*100));
 return`<div class="card"><b>${f.n}</b><div class="bar"><i style="width:${p}%"></i></div>
 <p style="font-size:.9rem"><b>${rp(c)}</b> dari ${rp(f.t)} (${p}%)</p><p style="font-size:.85rem;color:#4a6558;margin:.4rem 0">Kebutuhan: ${f.keb}</p>
