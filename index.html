<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GreenAksi — Platform Aksi Lingkungan Generasi Muda</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--ink:#10281f;--moss:#2d6a4f;--leaf:#52b788;--mist:#eef4f0;--sun:#f2b134;--river:#1d6f8a;--red:#c8483a;--line:#d5e2da;--bg:#fbfdfb}
*{box-sizing:border-box;margin:0}
body{font-family:'Plus Jakarta Sans',system-ui,sans-serif;color:var(--ink);background:var(--bg);line-height:1.6}
a{color:inherit}
header{position:sticky;top:0;z-index:1000;background:var(--ink);color:#fff;display:flex;align-items:center;justify-content:space-between;padding:.7rem 1.2rem;flex-wrap:wrap;gap:.5rem}
.logo{font-weight:800;font-size:1.2rem;text-decoration:none}.logo span{color:var(--leaf)}
nav{display:flex;gap:.2rem;flex-wrap:wrap;position:relative}
nav a{text-decoration:none;font-size:.9rem;padding:.35rem .7rem;border-radius:99px;color:#cfe3d8}
nav a{position:relative;z-index:1;transition:color .2s,background .2s}nav a:hover{background:#ffffff14}nav a.on{color:#fff}
#pill{position:absolute;left:0;top:0;background:var(--moss);border-radius:99px;transition:transform .5s cubic-bezier(.3,1.4,.5,1),width .4s,height .4s}
main{max-width:1080px;margin:auto;padding:1.5rem 1.2rem 3rem}
h1{font-size:clamp(2rem,5vw,3.4rem);line-height:1.1;font-weight:800}
h2{font-size:1.6rem;margin-bottom:.3rem}
.sub{color:#4a6558;margin-bottom:1.2rem;max-width:62ch}
.hero{background:var(--ink);color:#fff;border-radius:20px;padding:3rem 2rem;margin-bottom:2rem;position:relative;overflow:hidden}
.hero p{max-width:55ch;color:#cfe3d8;margin:1rem 0 1.5rem}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:260px;height:260px;border-radius:50%;background:var(--moss);opacity:.5}
.btn{display:inline-block;background:var(--sun);color:var(--ink);border:0;font:inherit;font-weight:700;padding:.65rem 1.2rem;border-radius:10px;cursor:pointer;text-decoration:none}
.btn.alt{background:var(--moss);color:#fff}.btn.sm{padding:.35rem .8rem;font-size:.85rem}
.btn:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible,a:focus-visible{outline:3px solid var(--river);outline-offset:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:1rem}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:1.1rem}
.tool{text-decoration:none;display:block;transition:border-color .15s}.tool:hover{border-color:var(--moss)}
.tool b{display:block;font-size:1.05rem;margin:.3rem 0}.tool p{font-size:.9rem;color:#4a6558}
.ico{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;font-size:1.3rem;background:var(--mist)}
.stats{display:flex;gap:2rem;flex-wrap:wrap;margin:2rem 0}
.stats div{font-size:.9rem;color:#4a6558}.stats strong{display:block;font-size:1.8rem;color:var(--moss)}
.chips{display:flex;gap:.4rem;flex-wrap:wrap;margin-bottom:.8rem}
.chip{border:1px solid var(--line);background:#fff;padding:.3rem .8rem;border-radius:99px;cursor:pointer;font:inherit;font-size:.85rem}
.chip.on{background:var(--moss);color:#fff;border-color:var(--moss)}
#map{height:420px;border-radius:14px;border:1px solid var(--line);margin-bottom:1rem}
form{display:grid;gap:.6rem}
label{font-size:.85rem;font-weight:700}
input,select,textarea{font:inherit;padding:.55rem .7rem;border:1px solid var(--line);border-radius:8px;width:100%;background:#fff}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.2rem}
@media(max-width:760px){.two{grid-template-columns:1fr}}
.bar{height:10px;background:var(--mist);border-radius:9px;overflow:hidden;margin:.5rem 0 .3rem}
.bar i{display:block;height:100%;background:var(--leaf)}
.tag{display:inline-block;font-size:.75rem;padding:.1rem .6rem;border-radius:99px;background:var(--mist);color:var(--moss);font-weight:700}
table{width:100%;border-collapse:collapse;font-size:.9rem}td,th{text-align:left;padding:.5rem;border-bottom:1px solid var(--line)}
.stack{display:grid;gap:.8rem}
.ok{background:#e3f4ea;border-radius:8px;padding:.6rem .8rem;font-size:.9rem;margin-top:.6rem}
.check{display:flex;gap:.6rem;align-items:flex-start;padding:.6rem 0;border-bottom:1px solid var(--line)}.check input{width:auto;margin-top:.35rem}
.photo{aspect-ratio:4/3;border-radius:10px;display:grid;place-items:center;font-size:2rem;color:#fff}
.lvl{font-size:2.4rem;font-weight:800;color:var(--moss)}
.badge{opacity:.35}.badge.got{opacity:1}
footer{text-align:center;padding:2rem 1rem;color:#4a6558;font-size:.85rem;border-top:1px solid var(--line)}
/* ===== GERAK / ANIMASI ===== */
#sp{position:fixed;top:0;left:0;height:3px;width:100%;background:var(--sun);transform:scaleX(0);transform-origin:left;z-index:2000}
.hero{background:linear-gradient(120deg,#10281f,#1d4a38,#10281f);background-size:220% 220%;animation:bg 14s ease infinite}
.hero:after{z-index:0;animation:float 9s ease-in-out infinite}
.hero:before{content:"";position:absolute;left:-80px;bottom:-90px;width:240px;height:240px;border-radius:50%;background:var(--river);opacity:.35;animation:float 11s ease-in-out infinite reverse}
.hero>*{position:relative;z-index:1}.hero>.lf{position:absolute;font-style:normal;font-size:2rem;animation:drift 7s ease-in-out infinite}
.w{display:inline-block;animation:rise .8s cubic-bezier(.2,.7,.2,1) backwards;animation-delay:calc(var(--i)*90ms + 250ms)}
.btn{transition:transform .15s,box-shadow .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 6px 14px #0003}.btn:active{transform:scale(.95)}
.card{transition:transform .25s,box-shadow .25s,border-color .15s}
.grid>.card:hover{transform:translateY(-5px);box-shadow:0 14px 28px #10281f1f}
.tool .ico{transition:transform .35s cubic-bezier(.3,1.6,.5,1)}.tool:hover .ico{transform:rotate(-10deg) scale(1.18)}
.rv{opacity:0;transform:translateY(26px);transition:opacity .7s cubic-bezier(.2,.7,.2,1) var(--d),transform .7s cubic-bezier(.2,.7,.2,1) var(--d)}
.rv.in{opacity:1;transform:none}.rv.done{transition:transform .25s,box-shadow .25s,border-color .15s}
.bar i{transition:width 1.2s cubic-bezier(.2,.7,.2,1)}
.ok{animation:rise .45s cubic-bezier(.2,.7,.2,1)}
.check span{transition:color .3s}.check input:checked+span{color:var(--moss)}
path.leaflet-interactive{animation:pop .55s cubic-bezier(.3,1.6,.5,1) backwards;transform-box:fill-box;transform-origin:center}
@keyframes rise{from{opacity:0;transform:translateY(.7em)}}
@keyframes pop{from{transform:scale(0);opacity:0}}
@keyframes bg{50%{background-position:100% 100%}}
@keyframes float{50%{transform:translate(-24px,26px) scale(1.1)}}
@keyframes drift{0%,100%{transform:translateY(0) rotate(-12deg)}50%{transform:translateY(-22px) rotate(14deg)}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}.rv{opacity:1!important;transform:none!important}}

.ph{position:relative;aspect-ratio:16/9;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,var(--c,#2d6a4f),#10281f);display:grid;place-items:center;font-size:2.6rem;margin-bottom:.7rem}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.pb p{font-size:.88rem;color:#4a6558;margin:.3rem 0 .6rem}.pb small{display:block;color:#4a6558;font-size:.78rem;margin-bottom:.6rem}
.mod{position:fixed;inset:0;background:#10281fb3;z-index:3000;display:grid;place-items:center;padding:1rem;animation:rise .25s}
.mb{background:#fff;border-radius:16px;padding:1.4rem;max-width:520px;width:100%;max-height:90vh;overflow:auto;position:relative}
.mb .x{position:absolute;right:.7rem;top:.4rem;border:0;background:none;font-size:1.7rem;cursor:pointer}
.steps{list-style:none;padding:0;counter-reset:s;display:grid;gap:.9rem;margin-top:1rem}
.steps li{counter-increment:s;padding-left:2.2rem;position:relative;font-size:.92rem}
.steps li:before{content:counter(s);position:absolute;left:0;top:0;width:1.6rem;height:1.6rem;border-radius:50%;background:var(--mist);display:grid;place-items:center;font-weight:800;font-size:.8rem}
.steps li.done:before{content:"\2713";background:var(--leaf);color:#fff}
.steps img{max-width:220px;border-radius:10px;border:1px solid var(--line);display:block;margin:.5rem 0}
.lock{text-align:center;padding:1.6rem;margin-top:1rem}.lock p{color:#4a6558;margin:.4rem 0 1rem}
details{margin-top:.8rem}summary{cursor:pointer;font-weight:700;font-size:.9rem}
.art{display:block;text-decoration:none}.art small{color:#4a6558}.art b{font-size:.95rem}
a.chip{text-decoration:none}.btn:disabled{opacity:.4;cursor:not-allowed}
h3{margin-bottom:.3rem}
</style>
</head>
